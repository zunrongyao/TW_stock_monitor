<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle Stock Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
    }

    body {
      padding: 10px;
    }
    
    /* Top Bar: Time + Settings */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: bold;
    }

    .header-btn {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 3px 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }

    /* Market Indices Banner */
    .indices-banner {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 6px;
      border-top: 2px solid #000;
      border-bottom: 2px solid #000;
      padding: 3px 6px;
      margin-bottom: 8px;
      background: #f8f8f8;
      font-size: 13px;
    }

    .index-card {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1px 4px;
    }

    .index-card:first-child {
      border-right: none;
    }

    .index-card:nth-child(2) {
      border-left: 1px solid #000;
      padding-left: 8px;
    }

    .index-name {
      font-size: 13px;
      font-weight: bold;
    }

    .index-price {
      font-size: 14px;
      font-weight: bold;
      margin: 0 4px;
    }

    .index-change {
      font-size: 12px;
      font-weight: bold;
    }

    /* Individual Stock Cards */
    .stock-card {
      border: 2px solid #000000;
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 5px;
      background: #ffffff;
    }

    .stock-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .symbol { font-size: 20px; font-weight: bold; }
    .price { font-size: 26px; font-weight: bold; }

    .stock-sub {
      display: flex;
      justify-content: flex-end;
      margin-top: 1px;
      font-size: 15px;
      font-weight: bold;
    }

    /* Pagination Bar */
    .pagination-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding: 6px 0;
    }

    .page-numbers {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .page-btn.active {
      background: #000000;
      color: #ffffff;
    }

    .page-nav-btn {
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      border-radius: 4px;
      padding: 4px 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .page-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Market Tabs Switcher */
    .tab-bar {
      display: flex;
      margin-bottom: 8px;
      border: 2px solid #000000;
      border-radius: 6px;
      overflow: hidden;
    }

    .tab-btn {
      flex: 1;
      padding: 6px 0;
      font-size: 16px;
      font-weight: bold;
      background: #ffffff;
      color: #000000;
      border: none;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: #000000;
      color: #ffffff;
    }

    .tab-btn:first-child {
      border-right: 2px solid #000000;
    }

    /* Settings Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95);
      z-index: 999;
      padding: 15px;
      overflow-y: auto;
    }

    .modal-box {
      border: 4px solid #000000;
      padding: 15px;
      background: #ffffff;
      border-radius: 8px;
    }

    .modal-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
      border-bottom: 2px solid #000;
      padding-bottom: 5px;
    }

    .modal-label {
      font-size: 15px;
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    .modal-input {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      border: 2px solid #000;
      margin: 4px 0 8px 0;
      font-weight: bold;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    .btn {
      padding: 8px 16px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid #000;
      cursor: pointer;
    }

    .btn-save { background: #000000; color: #ffffff; }
    .btn-cancel { background: #ffffff; color: #000000; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="header-bar">
    <span>更新時間: <span id="last-update">--:--</span></span>
    <button class="header-btn" onclick="openSettings()">⚙️ 設定 (Settings)</button>
  </div>

  <!-- Market Tabs Switcher (TW / US / MISC) -->
  <div class="tab-bar">
    <button id="tab-tw" class="tab-btn active" onclick="switchMarket('TW')">🇹🇼 台股 (TW)</button>
    <button id="tab-us" class="tab-btn" onclick="switchMarket('US')">🇺🇸 美股 (US)</button>
    <button id="tab-misc" class="tab-btn" onclick="switchMarket('MISC')">📊 綜合 (MISC)</button>
  </div>

  <!-- Indices Compact Banner (TW or US) -->
  <div class="indices-banner" id="indices-banner">
    <div class="index-card" id="idx-1">
      <div class="index-name">加權指數 (TAIEX)</div>
      <div class="index-price">--.--</div>
      <div class="index-change">--</div>
    </div>
    <div class="index-card" id="idx-2">
      <div class="index-name">臺指期 (WTXP&)</div>
      <div class="index-price">--.--</div>
      <div class="index-change">--</div>
    </div>
  </div>

  <!-- Individual Stock Watch List / MISC Container -->
  <div id="dashboard-content">
    <div class="loading">📊 載入中...</div>
  </div>

  <!-- Settings Modal Dialog -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">⚙️ 自選清單設定</div>
      
      <div style="font-weight:bold; font-size:17px; margin-bottom:4px; text-decoration:underline;">🇹🇼 台股清單</div>
      <label class="modal-label">上市股票 (代號逗號分隔，免輸入.TW)：</label>
      <input type="text" id="tw-stocks-input" class="modal-input" placeholder="例如: 2330, 2317, 2454">
      
      <label class="modal-label">上櫃股票 (代號逗號分隔，免輸入.TWO)：</label>
      <input type="text" id="two-stocks-input" class="modal-input" placeholder="例如: 8069, 3293">

      <hr style="margin: 12px 0; border: 1px solid #000;">

      <div style="font-weight:bold; font-size:17px; margin-bottom:4px; text-decoration:underline;">🇺🇸 美股清單</div>
      <label class="modal-label">美股代號 (代號逗號分隔)：</label>
      <input type="text" id="us-stocks-input" class="modal-input" placeholder="例如: AAPL, NVDA, TSLA, MSFT, GOOGL">

      <p style="font-size: 12px; color: #555; margin-top: 4px;">儲存後可在頂部切換頁籤。</p>
      
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeSettings()">取消</button>
        <button class="btn btn-save" onclick="saveSettings()">儲存並更新</button>
      </div>
    </div>
  </div>

  <script>
    // Current Market Tab ('TW', 'US', 'MISC')
    let currentMarket = 'TW';

    // Defaults
    const DEFAULT_TW_STOCKS = ["2330.TW", "2317.TW", "2454.TW"];
    const DEFAULT_US_STOCKS = ["AAPL", "NVDA", "TSLA", "MSFT", "GOOGL"];

    function getStockList(market = currentMarket) {
      if (market === 'US') {
        const savedUS = localStorage.getItem('kindle_us_stock_list');
        if (savedUS) return savedUS.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
        return DEFAULT_US_STOCKS;
      } else {
        const savedTW = localStorage.getItem('kindle_stock_list');
        if (savedTW) return savedTW.split(',').map(s => s.trim()).filter(Boolean);
        return DEFAULT_TW_STOCKS;
      }
    }

    function switchMarket(market) {
      if (currentMarket === market) return;
      currentMarket = market;
      currentPage = 1;

      document.getElementById('tab-tw').classList.toggle('active', market === 'TW');
      document.getElementById('tab-us').classList.toggle('active', market === 'US');
      document.getElementById('tab-misc').classList.toggle('active', market === 'MISC');

      const banner = document.getElementById('indices-banner');
      if (banner) banner.style.display = (market === 'MISC') ? 'none' : 'flex';

      loadAllData();
    }

    function openSettings() {
      // Load TW
      const twFullList = getStockList('TW');
      const twList = [];
      const twoList = [];

      twFullList.forEach(item => {
        if (item.endsWith('.TWO')) {
          twoList.push(item.replace('.TWO', ''));
        } else {
          twList.push(item.replace('.TW', ''));
        }
      });

      document.getElementById('tw-stocks-input').value = twList.join(', ');
      document.getElementById('two-stocks-input').value = twoList.join(', ');

      // Load US
      const usList = getStockList('US');
      document.getElementById('us-stocks-input').value = usList.join(', ');

      document.getElementById('settings-modal').style.display = 'block';
    }

    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    function saveSettings() {
      // TW save
      const twInput = document.getElementById('tw-stocks-input').value;
      const twoInput = document.getElementById('two-stocks-input').value;
      const twItems = twInput.split(',').map(s => s.trim()).filter(Boolean).map(code => code.includes('.') ? code : `${code}.TW`);
      const twoItems = twoInput.split(',').map(s => s.trim()).filter(Boolean).map(code => code.includes('.') ? code : `${code}.TWO`);
      const fullTwList = [...twItems, ...twoItems];
      if (fullTwList.length > 0) {
        localStorage.setItem('kindle_stock_list', fullTwList.join(', '));
      }

      // US save
      const usInput = document.getElementById('us-stocks-input').value;
      const usItems = usInput.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
      if (usItems.length > 0) {
        localStorage.setItem('kindle_us_stock_list', usItems.join(', '));
      }

      closeSettings();
      loadAllData();
    }

    // Helper to fetch single symbol data
    async function fetchSymbol(symbol) {
      try {
        const response = await fetch(`/api/stock?symbol=${encodeURIComponent(symbol)}`);
        if (!response.ok) return null;
        return await response.json();
      } catch (e) {
        return null;
      }
    }

    // Load Top Indices based on current market
    async function loadIndices() {
      const idx2 = document.getElementById('idx-2');

      if (currentMarket === 'TW') {
        if (idx2) idx2.style.display = 'none';
        const taiexData = await fetchSymbol('^TWII');
        updateIndexUI('idx-1', '加權指數 (TAIEX)', taiexData);
      } else {
        if (idx2) idx2.style.display = 'flex';
        const [spData, nasdaqData] = await Promise.all([
          fetchSymbol('^GSPC'),
          fetchSymbol('^IXIC')
        ]);
        updateIndexUI('idx-1', 'S&P 500', spData);
        updateIndexUI('idx-2', 'Nasdaq', nasdaqData);
      }
    }

    function updateIndexUI(elementId, label, data) {
      const card = document.getElementById(elementId);
      if (!card) return;

      card.querySelector('.index-name').innerText = label;

      if (data && data.price !== '--') {
        const isPositive = parseFloat(data.change) >= 0;
        const arrow = isPositive ? "▲ +" : "▼ ";
        card.querySelector('.index-price').innerText = data.price;
        card.querySelector('.index-change').innerText = `${arrow}${data.change} (${data.changePercent}%)`;
      } else {
        card.querySelector('.index-price').innerText = '--.--';
        card.querySelector('.index-change').innerText = '休市/更新中';
      }
    }

    // Pagination State
    let currentPage = 1;
    const PAGE_SIZE = 7;

    // Load Individual Watchlist
    async function loadStockCards() {
      const symbols = getStockList();
      const container = document.getElementById('dashboard-content');
      const totalPages = Math.ceil(symbols.length / PAGE_SIZE) || 1;

      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIndex = (currentPage - 1) * PAGE_SIZE;
      const pageSymbols = symbols.slice(startIndex, startIndex + PAGE_SIZE);

      const cards = await Promise.all(pageSymbols.map(async (symbol) => {
        const data = await fetchSymbol(symbol);
        const stockCode = symbol.replace('.TW','').replace('.TWO','');
        
        if (!data || data.price === '--') {
          return `
            <div class="stock-card">
              <div class="stock-main">
                <span class="symbol">${stockCode}</span>
                <span class="price" style="font-size:20px;">休市 / 無資料</span>
              </div>
            </div>
          `;
        }

        const isPositive = parseFloat(data.change) >= 0;
        const arrow = isPositive ? "▲ +" : "▼ ";
        const stockName = (data.name && data.name !== data.symbol) ? data.name : '';
        const titleText = stockName ? `${stockCode} ${stockName}` : stockCode;

        let rangeHtml = '';
        if (data.dayHigh && data.dayHigh !== '--' && data.dayLow && data.dayLow !== '--') {
          rangeHtml = `<span style="font-size: 13px; font-weight: normal; margin-right: 8px;">高:${data.dayHigh} 低:${data.dayLow}</span>`;
        }

        let extHtml = '';
        if (data.extendedMarket) {
          extHtml = `<span style="font-size: 13px; font-weight: normal; margin-right: 8px;">${data.extendedMarket.label}: ${data.extendedMarket.price} (${data.extendedMarket.changePercent})</span>`;
        }

        return `
          <div class="stock-card" onclick="openDetailModal('${symbol}')" style="cursor:pointer;">
            <div class="stock-main">
              <span class="symbol">${titleText}</span>
              <span class="price">${data.price}</span>
            </div>
            <div class="stock-sub">
              ${rangeHtml}${extHtml}
              <span>${arrow}${data.change} (${data.changePercent}%)</span>
            </div>
          </div>
        `;
      }));

      // Pagination Controls HTML
      let paginationHtml = '';
      if (totalPages > 1) {
        let pageBtns = '';
        for (let i = 1; i <= totalPages; i++) {
          const activeClass = i === currentPage ? 'active' : '';
          pageBtns += `<button class="page-btn ${activeClass}" onclick="changePage(${i})">${i}</button>`;
        }

        const prevDisabled = currentPage === 1 ? 'disabled' : '';
        const nextDisabled = currentPage === totalPages ? 'disabled' : '';

        paginationHtml = `
          <div class="pagination-bar">
            <button class="page-nav-btn" ${prevDisabled} onclick="changePage(${currentPage - 1})">◀ 上頁</button>
            <div class="page-numbers">${pageBtns}</div>
            <button class="page-nav-btn" ${nextDisabled} onclick="changePage(${currentPage + 1})">下頁 ▶</button>
          </div>
        `;
      }

      container.innerHTML = cards.join('') + paginationHtml;
    }

    function changePage(page) {
      currentPage = page;
      loadStockCards();
    }

    // Detail Modal for Today's Trend Chart
    let stockCache = {};

    async function openDetailModal(symbol) {
      document.getElementById('detail-modal').style.display = 'block';
      document.getElementById('detail-title').innerText = '載入中...';
      document.getElementById('detail-price-info').innerText = '';
      document.getElementById('chart-container').innerHTML = '<div style="text-align:center; padding: 40px; font-size: 20px;">📈 繪製走勢圖中...</div>';

      const data = await fetchSymbol(symbol);
      if (!data) {
        document.getElementById('detail-title').innerText = '無法載入資料';
        return;
      }

      const stockCode = symbol.replace('.TW','').replace('.TWO','');
      const titleText = (data.name && data.name !== data.symbol) ? `${stockCode} ${data.name}` : stockCode;
      const isPositive = parseFloat(data.change) >= 0;
      const arrow = isPositive ? "▲ +" : "▼ ";

      document.getElementById('detail-title').innerText = titleText;
      document.getElementById('detail-price-info').innerText = `${data.price}  |  ${arrow}${data.change} (${data.changePercent}%)  |  昨收: ${data.previousClose}`;

      if (data.chart && data.chart.length > 0) {
        renderSvgChart('chart-container', data.chart, parseFloat(data.previousClose));
      } else {
        document.getElementById('chart-container').innerHTML = '<div style="text-align:center; padding: 40px; font-size: 18px;">無今日走勢圖資料</div>';
      }
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').style.display = 'none';
    }

    // Pure SVG Chart Renderer (optimized for e-ink monochrome)
    function renderSvgChart(containerId, points, prevClose) {
      const width = 600;
      const height = 280;
      const padding = { top: 20, right: 20, bottom: 30, left: 55 };

      const prices = points.map(p => p.price);
      if (prevClose) prices.push(prevClose);

      let minPrice = Math.min(...prices);
      let maxPrice = Math.max(...prices);

      if (minPrice === maxPrice) {
        minPrice -= 1;
        maxPrice += 1;
      }

      const priceRange = maxPrice - minPrice;
      minPrice -= priceRange * 0.05;
      maxPrice += priceRange * 0.05;

      const chartW = width - padding.left - padding.right;
      const chartH = height - padding.top - padding.bottom;

      const getX = (idx) => padding.left + (idx / (points.length - 1 || 1)) * chartW;
      const getY = (price) => padding.top + chartH - ((price - minPrice) / (maxPrice - minPrice)) * chartH;

      // Build path data
      let pathD = '';
      points.forEach((pt, i) => {
        const x = getX(i);
        const y = getY(pt.price);
        pathD += (i === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`);
      });

      // Previous close reference line Y
      const prevCloseY = prevClose ? getY(prevClose) : null;

      // Start/End Time Labels
      const startTime = points[0].time;
      const endTime = points[points.length - 1].time;

      let svg = `
        <svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; background:#ffffff; font-family:sans-serif;">
          <!-- Grid Lines -->
          <line x1="${padding.left}" y1="${padding.top}" x2="${width - padding.right}" y2="${padding.top}" stroke="#ddd" stroke-dasharray="3,3"/>
          <line x1="${padding.left}" y1="${padding.top + chartH}" x2="${width - padding.right}" y2="${padding.top + chartH}" stroke="#000" stroke-width="2"/>
          <line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${padding.top + chartH}" stroke="#000" stroke-width="2"/>

          <!-- High/Low Price Y Labels -->
          <text x="${padding.left - 5}" y="${padding.top + 5}" text-anchor="end" font-size="12" font-weight="bold">${maxPrice.toFixed(1)}</text>
          <text x="${padding.left - 5}" y="${padding.top + chartH}" text-anchor="end" font-size="12" font-weight="bold">${minPrice.toFixed(1)}</text>

          <!-- Previous Close Reference Line -->
          ${prevCloseY && prevCloseY >= padding.top && prevCloseY <= padding.top + chartH ? `
            <line x1="${padding.left}" y1="${prevCloseY}" x2="${width - padding.right}" y2="${prevCloseY}" stroke="#666" stroke-width="1.5" stroke-dasharray="4,4"/>
            <text x="${width - padding.right}" y="${prevCloseY - 4}" text-anchor="end" font-size="11" fill="#444">昨收 ${prevClose.toFixed(1)}</text>
          ` : ''}

          <!-- Trend Line -->
          <path d="${pathD}" fill="none" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

          <!-- Time X Labels -->
          <text x="${padding.left}" y="${height - 8}" text-anchor="start" font-size="12" font-weight="bold">${startTime}</text>
          <text x="${width - padding.right}" y="${height - 8}" text-anchor="end" font-size="12" font-weight="bold">${endTime}</text>
        </svg>
      `;

      document.getElementById(containerId).innerHTML = svg;
    }

    async function loadMiscPage() {
      const container = document.getElementById('dashboard-content');
      container.innerHTML = '<div class="loading">📊 載入大盤融資與市場資訊中...</div>';

      const data = await fetchSymbol('MISC');
      if (!data || data.error) {
        container.innerHTML = '<div style="text-align:center; padding:30px; font-size:18px;">無法取得市場資訊</div>';
        return;
      }

      container.innerHTML = `
        <div style="border: 3px solid #000; border-radius: 8px; padding: 14px; background: #fff; margin-bottom: 12px;">
          <div style="font-size: 20px; font-weight: bold; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 10px; display:flex; justify-space-between;">
            <span>🇹🇼 台股大盤融資統計</span>
            <span style="font-size:14px; font-weight:normal; align-self:flex-end;">${data.marginDate}</span>
          </div>

          <div style="display:flex; justify-content:space-between; margin-bottom: 12px;">
            <div>
              <div style="font-size: 14px; font-weight:bold;">加權指數 (TAIEX)</div>
              <div style="font-size: 28px; font-weight:bold;">${data.taiexPrice}</div>
              <div style="font-size: 14px; font-weight:bold;">${data.taiexChange}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-size: 14px; font-weight:bold;">全市場融資餘額</div>
              <div style="font-size: 28px; font-weight:bold;">${data.marginBalance} 億</div>
              <div style="font-size: 14px; font-weight:bold;">單日變動: ${data.marginChange} 億</div>
            </div>
          </div>

          <div style="border-top: 1px dashed #000; padding-top: 10px; font-size: 13px; line-height: 1.5; background: #fdfdfd; padding: 10px; border-radius: 4px;">
            <div style="font-weight:bold; font-size:14px; margin-bottom:4px;">💡 融資維護率參考觀念：</div>
            • <b>大盤安全線 (> 160%)</b>：多頭格局，市場槓桿健全。<br>
            • <b>警戒區 (< 140%)</b>：散戶斷頭壓力漸增。<br>
            • <b>追繳斷頭區 (< 130%)</b>：引發融資停損斷頭潮與大盤落底訊號。
          </div>
        </div>
      `;
    }

    async function loadAllData() {
      if (currentMarket === 'MISC') {
        await loadMiscPage();
      } else {
        await Promise.all([loadIndices(), loadStockCards()]);
      }
      
      const now = new Date();
      const options = { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false };
      document.getElementById('last-update').innerText = new Intl.DateTimeFormat('zh-TW', options).format(now);
    }

    // Smart Auto-Refresh Timer
    function getNextRefreshInterval() {
      // Calculate current time in Asia/Taipei timezone
      const nowTaipei = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Taipei" }));
      const day = nowTaipei.getDay(); // 0 = Sun, 1 = Mon, ..., 6 = Sat
      const hours = nowTaipei.getHours();
      const mins = nowTaipei.getMinutes();
      const totalMins = hours * 60 + mins;

      // TW Market Trading Hours: Mon-Fri 09:00 (540m) to 13:35 (815m)
      const isTWTradingHours = (day >= 1 && day <= 5) && (totalMins >= 540 && totalMins <= 815);

      // US Market Trading Hours (Taiwan Time): Mon night to Sat morning ~21:30 (1290m) - 04:00 (240m)
      const isUSTradingHours = (totalMins >= 1290 || totalMins <= 240);

      // If active trading hours in either TW or US, refresh every 5 minutes (300,000ms)
      if (currentMarket === 'TW' && isTWTradingHours) return 5 * 60 * 1000;
      if (currentMarket === 'US' && isUSTradingHours) return 5 * 60 * 1000;

      // Off-market hours: refresh every 10 minutes to save power
      return 10 * 60 * 1000;
    }

    let refreshTimer = null;
    function scheduleAutoRefresh() {
      if (refreshTimer) clearTimeout(refreshTimer);
      const interval = getNextRefreshInterval();
      refreshTimer = setTimeout(async () => {
        await loadAllData();
        scheduleAutoRefresh();
      }, interval);
    }

    window.onload = () => {
      loadAllData();
      scheduleAutoRefresh();
    };
  </script>
