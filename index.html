<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle Stock Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
    }

    body {
      padding: 12px;
    }
    
    /* Top Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid #000000;
      padding-bottom: 8px;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .header-btn {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 4px 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }

    /* Stock Card Styles */
    .stock-card {
      border: 3px solid #000000;
      border-radius: 8px;
      padding: 12px 15px;
      margin-bottom: 12px;
      background: #ffffff;
    }

    .stock-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .symbol { font-size: 30px; font-weight: bold; }
    .price { font-size: 42px; font-weight: bold; }

    .stock-sub {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 20px;
      font-weight: bold;
    }

    .loading { text-align: center; font-size: 24px; margin-top: 50px; }

    /* Settings Modal Dialog (Kindle Optimized) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95);
      z-index: 999;
      padding: 20px;
    }

    .modal-box {
      border: 4px solid #000000;
      padding: 15px;
      background: #ffffff;
      border-radius: 8px;
    }

    .modal-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
      border-bottom: 2px solid #000;
      padding-bottom: 5px;
    }

    .modal-input {
      width: 100%;
      padding: 10px;
      font-size: 20px;
      border: 2px solid #000;
      margin: 10px 0;
      font-weight: bold;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    .btn {
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      border: 3px solid #000;
      cursor: pointer;
    }

    .btn-save { background: #000000; color: #ffffff; }
    .btn-cancel { background: #ffffff; color: #000000; }
  </style>
</head>
<body>

  <!-- Top Header Bar -->
  <div class="header">
    <span>更新: <span id="last-update">--:--</span></span>
    <button class="header-btn" onclick="openSettings()">⚙️ 設定 (Settings)</button>
  </div>

  <!-- Stock Container -->
  <div id="dashboard-content">
    <div class="loading">📊 載入中...</div>
  </div>

  <!-- Settings Modal Overlay -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">⚙️ 股票清單設定</div>
      <p style="font-size: 16px; margin-bottom: 5px;">請輸入股票代號（用逗號 `,` 分隔）：</p>
      <input type="text" id="stocks-input" class="modal-input" placeholder="例如: 2330.TW, 2317.TW, NVDA">
      <p style="font-size: 14px; color: #333;">台股上市加 `.TW`，上櫃加 `.TWO`，美股直接填代號。</p>
      
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeSettings()">取消</button>
        <button class="btn btn-save" onclick="saveSettings()">儲存並更新</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_STOCKS = ["2330.TW", "2454.TW", "NVDA"];

    // Get active stock list: Priority: URL parameter -> LocalStorage -> Default List
    function getStockList() {
      const params = new URLSearchParams(window.location.search);
      const urlStocks = params.get('stocks');
      if (urlStocks) return urlStocks.split(',').map(s => s.trim());

      const savedStocks = localStorage.getItem('kindle_stock_list');
      if (savedStocks) return savedStocks.split(',').map(s => s.trim());

      return DEFAULT_STOCKS;
    }

    // Modal UI Controls
    function openSettings() {
      const currentList = getStockList().join(', ');
      document.getElementById('stocks-input').value = currentList;
      document.getElementById('settings-modal').style.display = 'block';
    }

    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    function saveSettings() {
      const inputValue = document.getElementById('stocks-input').value;
      if (inputValue.trim()) {
        localStorage.setItem('kindle_stock_list', inputValue.trim());
        closeSettings();
        loadAllStocks(); // Refresh immediately
      }
    }

    // Fetch Stock Data from Vercel Backend
    async function fetchStockFromBackend(symbol) {
      try {
        const response = await fetch(`/api/stock?symbol=${symbol}`);
        if (!response.ok) throw new Error('API Error');
        const data = await response.json();

        const isPositive = parseFloat(data.change) >= 0;
        const arrow = isPositive ? "▲ +" : "▼ ";

        return `
          <div class="stock-card">
            <div class="stock-main">
              <span class="symbol">${data.symbol}</span>
              <span class="price">${data.price}</span>
            </div>
            <div class="stock-sub">
              <span>昨收: ${data.previousClose}</span>
              <span>${arrow}${data.change} (${data.changePercent}%)</span>
            </div>
          </div>
        `;
      } catch (err) {
        return `
          <div class="stock-card">
            <div class="stock-main">
              <span class="symbol">${symbol}</span>
              <span class="price" style="font-size:24px;">連線異常</span>
            </div>
          </div>
        `;
      }
    }

    async function loadAllStocks() {
      const symbols = getStockList();
      const container = document.getElementById('dashboard-content');
      
      const cards = await Promise.all(symbols.map(s => fetchStockFromBackend(s)));
      container.innerHTML = cards.join('');
      
      const now = new Date();
      document.getElementById('last-update').innerText = 
        now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }

    window.onload = () => {
      loadAllStocks();
      setInterval(loadAllStocks, 3 * 60 * 1000); // Refresh every 3 minutes
    };
  </script>
</body>
</html>
