<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle Stock Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background-color: #ffffff;
      color: #000000;
      padding: 15px;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #000000;
      padding-bottom: 8px;
      margin-bottom: 15px;
      font-size: 16px;
      font-weight: bold;
    }

    .stock-card {
      border: 2px solid #000000;
      border-radius: 6px;
      padding: 12px 15px;
      margin-bottom: 12px;
      background: #ffffff;
    }

    .stock-main {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .symbol { font-size: 26px; font-weight: bold; }
    .price { font-size: 38px; font-weight: bold; }

    .stock-sub {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-size: 18px;
    }

    .loading { text-align: center; font-size: 22px; margin-top: 50px; }
  </style>
</head>
<body>

  <div class="header">
    <span id="net-status">🟢 已連線</span>
    <span>更新時間: <span id="last-update">--:--</span></span>
  </div>

  <div id="dashboard-content">
    <div class="loading">📊 正在載入最新股價...</div>
  </div>

  <script>
    const DEFAULT_STOCKS = ["2330.TW", "2454.TW", "NVDA"];

    function getStockListFromURL() {
      const params = new URLSearchParams(window.location.search);
      const stocksParam = params.get('stocks');
      return stocksParam ? stocksParam.split(',').map(s => s.trim()) : DEFAULT_STOCKS;
    }

    async function fetchStockFromBackend(symbol) {
      try {
        // 關鍵：呼叫我們自己寫的 Vercel 後端 API
        const response = await fetch(`/api/stock?symbol=${symbol}`);
        if (!response.ok) throw new Error('後端回應錯誤');
        const data = await response.json();

        const isPositive = parseFloat(data.change) >= 0;
        const arrow = isPositive ? "▲ +" : "▼ ";

        return `
          <div class="stock-card">
            <div class="stock-main">
              <span class="symbol">${data.symbol}</span>
              <span class="price">${data.price}</span>
            </div>
            <div class="stock-sub">
              <span>昨收: ${data.previousClose}</span>
              <span>${arrow}${data.change} (${data.changePercent}%)</span>
            </div>
          </div>
        `;
      } catch (err) {
        return `
          <div class="stock-card">
            <div class="stock-main">
              <span class="symbol">${symbol}</span>
              <span class="price" style="font-size:24px;">連線異常</span>
            </div>
          </div>
        `;
      }
    }

    async function loadAllStocks() {
      const symbols = getStockListFromURL();
      const container = document.getElementById('dashboard-content');
      
      const cards = await Promise.all(symbols.map(s => fetchStockFromBackend(s)));
      container.innerHTML = cards.join('');
      
      const now = new Date();
      document.getElementById('last-update').innerText = 
        now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }

    window.onload = () => {
      loadAllStocks();
      setInterval(loadAllStocks, 3 * 60 * 1000);
    };
  </script>
</body>
</html>
