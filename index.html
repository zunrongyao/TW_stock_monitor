<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle Stock Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 100%;
    height: 100%;
    background-color: #ffffff;
    color: #000000;
    font-family: sans-serif;
    overflow: hidden; /* 隱藏右側捲動條 */
  }

  body {
    padding: 10px 15px;
  }
  
  /* 頂部狀態列 */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 4px solid #000000;
    padding-bottom: 8px;
    margin-bottom: 15px;
    font-size: 20px;
    font-weight: bold;
  }

  /* 股票卡片：加大字體與邊框 */
  .stock-card {
    border: 3px solid #000000;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
    background: #ffffff;
  }

  .stock-main {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .symbol { font-size: 32px; font-weight: bold; }
  .price { font-size: 46px; font-weight: bold; }

  .stock-sub {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 22px;
    font-weight: 500;
  }

  .loading { text-align: center; font-size: 26px; margin-top: 60px; }
</style>
</head>
<body>

  <div class="header">
    <span id="net-status">🟢 已連線</span>
    <span>更新時間: <span id="last-update">--:--</span></span>
  </div>

  <div id="dashboard-content">
    <div class="loading">📊 正在載入最新股價...</div>
  </div>

<script>
    // ==========================================
    // 💡 1. Kindle 專用：自動隱藏頂部工具列與全螢幕邏輯
    // ==========================================
    window.addEventListener('load', function() {
      setTimeout(function() {
        window.scrollTo(0, 1); // 載入 1 秒後自動往下微幅捲動，觸發 Kindle 隱藏網址列
      }, 1000);
    });

    // 點擊畫面任意處時，嘗試切換為滿版全螢幕
    document.addEventListener('click', function() {
      var docEl = document.documentElement;
      var req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestHtml5Fullscreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl);
      }
    });

    // ==========================================
    // 📊 2. 股票 Dashboard 主邏輯
    // ==========================================
    const DEFAULT_STOCKS = ["2330.TW", "2454.TW", "NVDA"];

    function getStockListFromURL() {
      const params = new URLSearchParams(window.location.search);
      const stocksParam = params.get('stocks');
      return stocksParam ? stocksParam.split(',').map(s => s.trim()) : DEFAULT_STOCKS;
    }

    async function fetchStockFromBackend(symbol) {
      try {
        const response = await fetch(`/api/stock?symbol=${symbol}`);
        if (!response.ok) throw new Error('後端回應錯誤');
        const data = await response.json();

        const isPositive = parseFloat(data.change) >= 0;
        const arrow = isPositive ? "▲ +" : "▼ ";

        return `
          <div class="stock-card">
            <div class="stock-main">
              <span class="symbol">${data.symbol}</span>
              <span class="price">${data.price}</span>
            </div>
            <div class="stock-sub">
              <span>昨收: ${data.previousClose}</span>
              <span>${arrow}${data.change} (${data.changePercent}%)</span>
            </div>
          </div>
        `;
      } catch (err) {
        return `
          <div class="stock-card">
            <div class="stock-main">
              <span class="symbol">${symbol}</span>
              <span class="price" style="font-size:24px;">連線異常</span>
            </div>
          </div>
        `;
      }
    }

    async function loadAllStocks() {
      const symbols = getStockListFromURL();
      const container = document.getElementById('dashboard-content');
      
      const cards = await Promise.all(symbols.map(s => fetchStockFromBackend(s)));
      container.innerHTML = cards.join('');
      
      const now = new Date();
      document.getElementById('last-update').innerText = 
        now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }

    window.onload = () => {
      loadAllStocks();
      setInterval(loadAllStocks, 3 * 60 * 1000); // 每 3 分鐘自動更新一次
    };
  </script>
</body>
</html>
